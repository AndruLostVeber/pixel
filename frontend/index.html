<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PixelForge — Paint by Numbers</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <div class="logo">🎨 PixelForge</div>
  <div class="controls">
    <input id="prompt" type="text" placeholder="cute red dragon, isometric castle, magic potion bottle..." />
    <label title="FLUX-schnell — быстро (5с) и точно по промпту, через NVIDIA API. Local — SDXL+LoRA на твоей карте.">
      backend
      <select id="backend">
        <option value="flux-schnell" selected>FLUX.1-schnell ⚡</option>
        <option value="flux-dev">FLUX.1-dev (медленно, но качественно)</option>
        <option value="local">Local SDXL+LoRA</option>
      </select>
    </label>
    <label>grid <input id="grid_size" type="number" value="32" min="16" max="96" step="8" /></label>
    <label>colors <input id="n_colors" type="number" value="12" min="4" max="32" /></label>
    <button id="generate-btn">Generate ⚡</button>
  </div>
</header>

<main>
  <section class="canvas-wrap">
    <canvas id="canvas" width="768" height="768"></canvas>
    <div id="status" class="status-overlay hidden">
      <div class="spinner"></div>
      <div id="status-text">Loading SDXL... первый запуск долгий</div>
    </div>
  </section>

  <aside class="sidebar">
    <div class="progress-block">
      <div class="progress-label">Закрашено</div>
      <div class="progress-num"><span id="filled-count">0</span> / <span id="total-count">0</span></div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <div class="errors">Ошибок: <span id="errors-count">0</span></div>
    </div>

    <div id="palette" class="palette"></div>

    <div class="actions">
      <button id="hint-btn" disabled>💡 Подсветить выбранный</button>
      <button id="autofill-btn" disabled>⚡ Залить выбранный</button>
      <button id="preview-btn" disabled>👁 Оригинал</button>
      <button id="reset-btn" disabled>↺ Сбросить раскраску</button>
    </div>
  </aside>
</main>

<div id="finish-modal" class="modal hidden">
  <div class="modal-card">
    <h2>🎉 Готово!</h2>
    <p>Раскрашено за <span id="finish-time"></span></p>
    <p>Ошибок: <span id="finish-errors"></span></p>
    <img id="finish-preview" />
    <button id="finish-close">OK</button>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
