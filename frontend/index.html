<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PixelForge — Paint by Numbers</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <div class="logo">🎨 PixelForge</div>
  <div class="controls">
    <input id="prompt" type="text" placeholder="cute red dragon, isometric castle, magic potion bottle..." />
    <button id="dice-btn" type="button" class="icon-btn" title="Случайный промпт">🎲</button>
    <label title="FLUX-schnell — быстро (5с) и точно по промпту, через NVIDIA API. Local — SDXL+LoRA на твоей карте.">
      backend
      <select id="backend">
        <option value="flux-schnell" selected>FLUX.1-schnell ⚡</option>
        <option value="flux-dev">FLUX.1-dev (медленно, но качественно)</option>
        <option value="local">Local SDXL+LoRA</option>
      </select>
    </label>
    <label title="Easy — мелкая сетка, кнопка-помощник. Hard — крупная сетка, без помощников.">
      mode
      <select id="difficulty">
        <option value="easy">😊 Easy</option>
        <option value="normal" selected>🎯 Normal</option>
        <option value="hard">💀 Hard</option>
        <option value="custom">⚙️ Custom</option>
      </select>
    </label>
    <label>grid <input id="grid_size" type="number" value="32" min="16" max="96" step="8" /></label>
    <label>colors <input id="n_colors" type="number" value="12" min="4" max="32" /></label>
    <button id="generate-btn">Generate ⚡</button>
  </div>
  <div class="presets" id="presets"></div>
</header>

<main>
  <section class="canvas-wrap">
    <canvas id="canvas" width="768" height="768"></canvas>
    <div id="status" class="status-overlay hidden">
      <div class="spinner"></div>
      <div id="status-text">Loading SDXL... первый запуск долгий</div>
    </div>
  </section>

  <aside class="sidebar">
    <div class="progress-block">
      <div class="progress-label">Закрашено</div>
      <div class="progress-num"><span id="filled-count">0</span> / <span id="total-count">0</span></div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <div class="stats-row">
        <span class="stat-chip">⏱ <span id="timer">0:00</span></span>
        <span class="stat-chip">🔥 <span id="streak-count">0</span></span>
        <span class="stat-chip">★ <span id="best-streak">0</span></span>
        <span class="stat-chip stat-err">⚠ <span id="errors-count">0</span></span>
      </div>
    </div>

    <div id="palette" class="palette"></div>

    <div class="actions">
      <button id="hint-btn" disabled>💡 Подсветить выбранный <kbd>H</kbd></button>
      <button id="autofill-btn" disabled>⚡ Залить выбранный <kbd>A</kbd></button>
      <button id="preview-btn" disabled>👁 Оригинал <kbd>P</kbd></button>
      <button id="download-btn" disabled>💾 Скачать PNG <kbd>D</kbd></button>
      <button id="reset-btn" disabled>↺ Сбросить раскраску <kbd>R</kbd></button>
      <button id="trophy-btn">🏆 Достижения</button>
      <label class="sound-toggle">
        <input id="sound-toggle" type="checkbox" checked /> 🔊 Звук <kbd>M</kbd>
      </label>
    </div>
  </aside>
</main>

<div id="trophy-modal" class="modal hidden">
  <div class="modal-card trophy-card">
    <h2>🏆 Достижения</h2>
    <div id="trophy-list" class="trophy-list"></div>
    <button id="trophy-close">Закрыть <kbd>Esc</kbd></button>
  </div>
</div>

<div id="finish-modal" class="modal hidden">
  <div class="modal-card">
    <h2>🎉 Готово!</h2>
    <p>Раскрашено за <span id="finish-time"></span></p>
    <p>Ошибок: <span id="finish-errors"></span></p>
    <img id="finish-preview" />
    <button id="finish-close">OK</button>
  </div>
</div>

<script src="/static/fx.js"></script>
<script src="/static/achievements.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
